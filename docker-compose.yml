services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: file-extraction-agent:local
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      UPLOAD_MAX_FILES: ${UPLOAD_MAX_FILES:-20}
      UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:-26214400}
      UPLOAD_MAX_REQUEST_BYTES: ${UPLOAD_MAX_REQUEST_BYTES:-104857600}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-1433}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_DATABASE: ${DB_DATABASE:-}
    volumes:
      - ./data:/data
      - ./data/output:/app/output
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
